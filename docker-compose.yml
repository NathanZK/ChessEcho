services:
  postgres:
    image: postgres:16-alpine
    container_name: chessecho-postgres
    environment:
      POSTGRES_DB: chessecho
      POSTGRES_USER: chessecho
      POSTGRES_PASSWORD: chessecho_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: chessecho-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chessecho
      SPRING_DATASOURCE_USERNAME: chessecho
      SPRING_DATASOURCE_PASSWORD: chessecho_pass
      STOCKFISH_PATH: stockfish
      CHESS_PUBAPI_USERNAME: ${CHESS_PUBAPI_USERNAME:-}
      CHESS_PUBAPI_CONTACT: ${CHESS_PUBAPI_CONTACT:-}
      CHESS_WEAKNESS_PRACTICAL_RANKING_ENABLED: ${CHESS_WEAKNESS_PRACTICAL_RANKING_ENABLED:-true}
      CHESS_WEAKNESS_PRACTICAL_SAMPLE_FLOOR: ${CHESS_WEAKNESS_PRACTICAL_SAMPLE_FLOOR:-5}
      CHESS_WEAKNESS_PRACTICAL_COMPARATOR_METHOD: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_METHOD:-FIXED_SCORE_RATE}
      CHESS_WEAKNESS_PRACTICAL_COMPARATOR_SCORE_RATE: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_SCORE_RATE:-0.5}
      CHESS_WEAKNESS_PRACTICAL_CONFIDENCE_METHOD: ${CHESS_WEAKNESS_PRACTICAL_CONFIDENCE_METHOD:-BERNOULLI_WILSON_SCORE_POINTS_HALF_DRAW_CONSERVATIVE}
      CHESS_WEAKNESS_PRACTICAL_WILSON_Z_SCORE: ${CHESS_WEAKNESS_PRACTICAL_WILSON_Z_SCORE:-1.0}
      CHESS_WEAKNESS_PRACTICAL_MEANINGFUL_DIFFERENCE: ${CHESS_WEAKNESS_PRACTICAL_MEANINGFUL_DIFFERENCE:-0.1}
      CHESS_WEAKNESS_PRACTICAL_MAX_PRIORITY_ADJUSTMENT: ${CHESS_WEAKNESS_PRACTICAL_MAX_PRIORITY_ADJUSTMENT:-0.25}
      CHESS_WEAKNESS_PRACTICAL_OBSERVATION_WINDOW_DAYS: ${CHESS_WEAKNESS_PRACTICAL_OBSERVATION_WINDOW_DAYS:-}
      CHESS_WEAKNESS_PRACTICAL_POLICY_VERSION: ${CHESS_WEAKNESS_PRACTICAL_POLICY_VERSION:-practical-score-rate-wilson-v1}

    depends_on:
      - postgres

volumes:
  postgres_data:
