version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chessecho-postgres
    environment:
      POSTGRES_DB: chessecho
      POSTGRES_USER: chessecho
      POSTGRES_PASSWORD: chessecho_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
