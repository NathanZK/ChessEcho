services:
  postgres:
    image: postgres:16-alpine
    container_name: chessprobe-postgres
    environment:
      POSTGRES_DB: chessprobe
      POSTGRES_USER: chessprobe
      POSTGRES_PASSWORD: chessprobe_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessprobe -d chessprobe"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  app:
    build: ./backend
    image: chess-probe
    container_name: chessprobe-app
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/test-double:/app/scripts/test-double:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CHESSPROBE_AUTH_COOKIE_SECURE: ${CHESSPROBE_AUTH_COOKIE_SECURE:-${CHESSECHO_AUTH_COOKIE_SECURE:-false}}
      CHESSECHO_AUTH_COOKIE_SECURE: ${CHESSECHO_AUTH_COOKIE_SECURE:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chessprobe
      SPRING_DATASOURCE_USERNAME: chessprobe
      SPRING_DATASOURCE_PASSWORD: chessprobe_pass
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/app/scripts/test-double/mock-stockfish.sh}
      STOCKFISH_REQUIRE_MOCK: ${STOCKFISH_REQUIRE_MOCK:-true}
      CHESS_PUBAPI_BASE_URL: ${CHESS_PUBAPI_BASE_URL:-http://host.docker.internal:8085}
      CHESS_PUBAPI_USERNAME: ${CHESS_PUBAPI_USERNAME:-e2e_agent}
      CHESS_PUBAPI_CONTACT: ${CHESS_PUBAPI_CONTACT:-e2e@chessecho.local}
      CHESS_WEAKNESS_PRACTICAL_RANKING_ENABLED: ${CHESS_WEAKNESS_PRACTICAL_RANKING_ENABLED:-true}
      CHESS_WEAKNESS_PRACTICAL_SAMPLE_FLOOR: ${CHESS_WEAKNESS_PRACTICAL_SAMPLE_FLOOR:-5}
      CHESS_WEAKNESS_PRACTICAL_COMPARATOR_METHOD: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_METHOD:-FIXED_SCORE_RATE}
      CHESS_WEAKNESS_PRACTICAL_COMPARATOR_SCORE_RATE: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_SCORE_RATE:-0.5}
      CHESS_WEAKNESS_PRACTICAL_CONFIDENCE_METHOD: ${CHESS_WEAKNESS_PRACTICAL_CONFIDENCE_METHOD:-BERNOULLI_WILSON_SCORE_POINTS_HALF_DRAW_CONSERVATIVE}
      CHESS_WEAKNESS_PRACTICAL_WILSON_Z_SCORE: ${CHESS_WEAKNESS_PRACTICAL_WILSON_Z_SCORE:-1.0}
      CHESS_WEAKNESS_PRACTICAL_MEANINGFUL_DIFFERENCE: ${CHESS_WEAKNESS_PRACTICAL_MEANINGFUL_DIFFERENCE:-0.1}
      CHESS_WEAKNESS_PRACTICAL_MAX_PRIORITY_ADJUSTMENT: ${CHESS_WEAKNESS_PRACTICAL_MAX_PRIORITY_ADJUSTMENT:-0.25}
      CHESS_WEAKNESS_PRACTICAL_OBSERVATION_WINDOW_DAYS: ${CHESS_WEAKNESS_PRACTICAL_OBSERVATION_WINDOW_DAYS:-}
      CHESS_WEAKNESS_PRACTICAL_POLICY_VERSION: ${CHESS_WEAKNESS_PRACTICAL_POLICY_VERSION:-practical-score-rate-wilson-v1}

    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
