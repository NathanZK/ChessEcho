spring:
  application:
    name: chess-echo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/chessprobe}
    username: ${SPRING_DATASOURCE_USERNAME:chessecho}
    password: ${SPRING_DATASOURCE_PASSWORD:chessprobe_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: ${CHESSPROBE_CORPUS_MULTIPART_MAX_FILE_SIZE:2GB}
      max-request-size: ${CHESSPROBE_CORPUS_MULTIPART_MAX_REQUEST_SIZE:3GB}

chessecho:
  auth:
    cookie:
      name: CHESSPROBE_SESSION
      secure: ${CHESSPROBE_AUTH_COOKIE_SECURE:true}
      same-site: ${CHESSPROBE_AUTH_COOKIE_SAME_SITE:Lax}
      path: /
    csrf:
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
    session:
      idle-timeout: ${CHESSPROBE_AUTH_SESSION_IDLE_TIMEOUT:PT30M}
      absolute-timeout: ${CHESSPROBE_AUTH_SESSION_ABSOLUTE_TIMEOUT:P30D}
    dev-mode:
      enabled: ${CHESSPROBE_AUTH_DEV_MODE_ENABLED:false}
  corpus:
    archive-root: ${CHESSPROBE_CORPUS_ARCHIVE_ROOT:/var/lib/chessecho/corpus-archive}
    max-archive-bytes: ${CHESSPROBE_CORPUS_MAX_ARCHIVE_BYTES:2147483648}
    max-expanded-bytes: ${CHESSPROBE_CORPUS_MAX_EXPANDED_BYTES:4294967296}
    max-games: ${CHESSPROBE_CORPUS_MAX_GAMES:100000}
    max-observations: ${CHESSPROBE_CORPUS_MAX_OBSERVATIONS:10000000}
    max-record-bytes: ${CHESSPROBE_CORPUS_MAX_RECORD_BYTES:4194304}
  clustering:
    alpha: ${CHESSPROBE_CLUSTERING_ALPHA:0.60}
    top-k: ${CHESSPROBE_CLUSTERING_TOP_K:30}
    candidate-limit: ${CHESSPROBE_CLUSTERING_CANDIDATE_LIMIT:200}
    floor-threshold: ${CHESSPROBE_CLUSTERING_FLOOR_THRESHOLD:0.40}
    top1-threshold: ${CHESSPROBE_CLUSTERING_TOP1_THRESHOLD:0.65}
    rb-resolution: ${CHESSPROBE_CLUSTERING_RB_RESOLUTION:1.25}
    centroid-threshold: ${CHESSPROBE_CLUSTERING_CENTROID_THRESHOLD:0.38}
  weakness:
    community:
      min-size: ${CHESSPROBE_WEAKNESS_COMMUNITY_MIN_SIZE:10}

chess:
  stockfish:
    path: ${STOCKFISH_PATH:stockfish}
  similarity:
    dynamic:
      max-concurrent-sessions: ${CHESS_SIMILARITY_DYNAMIC_MAX_CONCURRENT_SESSIONS:2}
      candidate-budget: ${CHESS_SIMILARITY_DYNAMIC_CANDIDATE_BUDGET:100}
  pubapi:
    user-agent-username: ${CHESS_PUBAPI_USERNAME:}
    contact: ${CHESS_PUBAPI_CONTACT:}
    delay-ms: ${CHESS_PUBAPI_DELAY_MS:100}
    max-retries: ${CHESS_PUBAPI_MAX_RETRIES:3}
    initial-backoff-ms: ${CHESS_PUBAPI_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${CHESS_PUBAPI_MAX_BACKOFF_MS:10000}
  weakness:
    practical:
      ranking-enabled: ${CHESS_WEAKNESS_PRACTICAL_RANKING_ENABLED:true}
      sample-floor: ${CHESS_WEAKNESS_PRACTICAL_SAMPLE_FLOOR:5}
      comparator-method: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_METHOD:FIXED_SCORE_RATE}
      comparator-score-rate: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_SCORE_RATE:0.5}
      confidence-method: ${CHESS_WEAKNESS_PRACTICAL_CONFIDENCE_METHOD:BERNOULLI_WILSON_SCORE_POINTS_HALF_DRAW_CONSERVATIVE}
      wilson-z-score: ${CHESS_WEAKNESS_PRACTICAL_WILSON_Z_SCORE:1.0}
      meaningful-difference: ${CHESS_WEAKNESS_PRACTICAL_MEANINGFUL_DIFFERENCE:0.1}
      max-priority-adjustment: ${CHESS_WEAKNESS_PRACTICAL_MAX_PRIORITY_ADJUSTMENT:0.25}
      observation-window-days: ${CHESS_WEAKNESS_PRACTICAL_OBSERVATION_WINDOW_DAYS:}
      policy-version: ${CHESS_WEAKNESS_PRACTICAL_POLICY_VERSION:practical-score-rate-wilson-v1}

engine:
  analysis:
    multi-pv: ${ENGINE_ANALYSIS_MULTI_PV:5}
  continuation:
    # continuation.max-eval-loss controls which candidate moves ChessEcho may play.
    multi-pv: ${ENGINE_CONTINUATION_MULTI_PV:5}
    max-eval-loss: ${ENGINE_CONTINUATION_MAX_EVAL_LOSS:0.50}
  exploration:
    # exploration.max-eval-loss controls how much evaluation loss we allow from the user during interactive exploration.
    max-eval-loss: ${ENGINE_EXPLORATION_MAX_EVAL_LOSS:0.80}


