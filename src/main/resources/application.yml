spring:
  application:
    name: chess-echo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/chessecho}
    username: ${SPRING_DATASOURCE_USERNAME:chessecho}
    password: ${SPRING_DATASOURCE_PASSWORD:chessecho_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

chess:
  stockfish:
    path: ${STOCKFISH_PATH:stockfish}
  pubapi:
    user-agent-username: ${CHESS_PUBAPI_USERNAME:}
    contact: ${CHESS_PUBAPI_CONTACT:}
    delay-ms: ${CHESS_PUBAPI_DELAY_MS:100}
    max-retries: ${CHESS_PUBAPI_MAX_RETRIES:3}
    initial-backoff-ms: ${CHESS_PUBAPI_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${CHESS_PUBAPI_MAX_BACKOFF_MS:10000}
  weakness:
    practical:
      ranking-enabled: ${CHESS_WEAKNESS_PRACTICAL_RANKING_ENABLED:false}
      sample-floor: ${CHESS_WEAKNESS_PRACTICAL_SAMPLE_FLOOR:}
      comparator-method: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_METHOD:DISABLED}
      comparator-score-rate: ${CHESS_WEAKNESS_PRACTICAL_COMPARATOR_SCORE_RATE:}
      confidence-method: ${CHESS_WEAKNESS_PRACTICAL_CONFIDENCE_METHOD:DISABLED}
      wilson-z-score: ${CHESS_WEAKNESS_PRACTICAL_WILSON_Z_SCORE:}
      meaningful-difference: ${CHESS_WEAKNESS_PRACTICAL_MEANINGFUL_DIFFERENCE:}
      max-priority-adjustment: ${CHESS_WEAKNESS_PRACTICAL_MAX_PRIORITY_ADJUSTMENT:}
      observation-window-days: ${CHESS_WEAKNESS_PRACTICAL_OBSERVATION_WINDOW_DAYS:}
      policy-version: ${CHESS_WEAKNESS_PRACTICAL_POLICY_VERSION:uncalibrated-v1}

engine:
  analysis:
    multi-pv: ${ENGINE_ANALYSIS_MULTI_PV:5}
  continuation:
    # continuation.max-eval-loss controls which candidate moves ChessEcho may play.
    multi-pv: ${ENGINE_CONTINUATION_MULTI_PV:5}
    max-eval-loss: ${ENGINE_CONTINUATION_MAX_EVAL_LOSS:0.50}
  exploration:
    # exploration.max-eval-loss controls how much evaluation loss we allow from the user during interactive exploration.
    max-eval-loss: ${ENGINE_EXPLORATION_MAX_EVAL_LOSS:0.80}




