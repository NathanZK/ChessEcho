spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

chess:
  pubapi:
    user-agent-username: test-operator
    contact: test-operator@example.com
    delay-ms: 0
    max-retries: 3
    initial-backoff-ms: 10
    max-backoff-ms: 50

engine:
  analysis:
    multi-pv: 5
  continuation:
    multi-pv: 5
    max-eval-loss: 0.50
  exploration:
    max-eval-loss: 0.80



