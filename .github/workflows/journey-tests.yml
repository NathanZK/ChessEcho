name: Journey Tests

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'API_CONTRACT.md'
              - '.github/workflows/journey-tests.yml'

  journeys:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies on cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run deterministic Playwright journeys
        run: npm run test:journeys

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  journey-gate:
    name: Journey Gate
    needs: [changes, journeys]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify journey test status
        run: |
          CHANGES_RESULT="${{ needs.changes.result }}"
          FRONTEND_FILTER="${{ needs.changes.outputs.frontend }}"
          JOURNEYS_RESULT="${{ needs.journeys.result }}"

          echo "Changes detection result: '${CHANGES_RESULT:-}'"
          echo "Frontend path filter:     '${FRONTEND_FILTER:-}'"
          echo "Journeys job result:      '${JOURNEYS_RESULT:-}'"

          # 1. Fail closed if changes job did not succeed
          if [ "${CHANGES_RESULT:-}" != "success" ]; then
            echo "::error::Changes detection job ended with non-success status: '${CHANGES_RESULT:-}'"
            exit 1
          fi

          # 2. When frontend changes are detected, journeys must succeed
          if [ "${FRONTEND_FILTER}" = "true" ]; then
            if [ "${JOURNEYS_RESULT:-}" != "success" ]; then
              echo "::error::Frontend changes detected, but journeys job was '${JOURNEYS_RESULT:-}' (expected 'success')."
              exit 1
            fi
          fi

          # 3. When no frontend changes are detected, journeys must be skipped
          if [ "${FRONTEND_FILTER}" = "false" ]; then
            if [ "${JOURNEYS_RESULT:-}" != "skipped" ]; then
              echo "::error::No frontend changes detected, but journeys job was '${JOURNEYS_RESULT:-}' (expected 'skipped')."
              exit 1
            fi
          fi

          # 4. Fail closed on unexpected failure or cancellation
          if [ "${JOURNEYS_RESULT:-}" != "success" ] && [ "${JOURNEYS_RESULT:-}" != "skipped" ]; then
            echo "::error::Journeys job ended with non-passing status '${JOURNEYS_RESULT:-}'."
            exit 1
          fi

          echo "Journey Gate passed successfully."
          exit 0
