name: Journey Tests

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'API_CONTRACT.md'
              - '.github/workflows/journey-tests.yml'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/test-double/**'
              - 'docker-compose.yml'
              - '.github/workflows/journey-tests.yml'

  journeys:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies on cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next.js build compilation
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build Next.js production application
        run: npm run build

      - name: Run deterministic Playwright journeys
        run: npm run test:journeys

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  fullstack-e2e:
    name: Full-Stack E2E (Docker & Test Double)
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start Mock Chess.com HTTP Provider
        run: |
          node scripts/test-double/server.js &
          echo "MOCK_PID=$!" >> $GITHUB_ENV
          timeout 15s bash -c 'until curl -s http://localhost:8085/health > /dev/null; do sleep 0.5; done'

      - name: Start Isolated Docker Backend & PostgreSQL
        run: |
          docker compose -p chessecho-e2e up -d --build postgres app
          timeout 60s bash -c 'until curl -s http://localhost:8080/api/me > /dev/null; do sleep 1; done'

      - name: Build Frontend Application
        run: cd frontend && npm run build

      - name: Run Docker-backed Full-Stack E2E Suite
        run: cd frontend && npm run test:e2e:docker

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-e2e-artifacts
          path: |
            frontend/journeys/artifacts/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose -p chessecho-e2e logs

      - name: Safe Isolated Teardown
        if: always()
        run: |
          docker compose -p chessecho-e2e down -v
          [ -n "$MOCK_PID" ] && kill $MOCK_PID || true

  journey-gate:
    name: Journey Gate
    needs: [changes, journeys, fullstack-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify journey test status
        run: |
          CHANGES_RESULT="${{ needs.changes.result }}"
          FRONTEND_FILTER="${{ needs.changes.outputs.frontend }}"
          JOURNEYS_RESULT="${{ needs.journeys.result }}"
          E2E_FILTER="${{ needs.changes.outputs.e2e }}"
          E2E_RESULT="${{ needs.fullstack-e2e.result }}"

          echo "Changes detection result: '${CHANGES_RESULT:-}'"
          echo "Frontend path filter:     '${FRONTEND_FILTER:-}'"
          echo "Journeys job result:      '${JOURNEYS_RESULT:-}'"
          echo "E2E path filter:          '${E2E_FILTER:-}'"
          echo "E2E job result:           '${E2E_RESULT:-}'"

          # 1. Fail closed if changes job did not succeed
          if [ "${CHANGES_RESULT:-}" != "success" ]; then
            echo "::error::Changes detection job ended with non-success status: '${CHANGES_RESULT:-}'"
            exit 1
          fi

          # 2. When frontend changes are detected, journeys must succeed
          if [ "${FRONTEND_FILTER}" = "true" ]; then
            if [ "${JOURNEYS_RESULT:-}" != "success" ]; then
              echo "::error::Frontend changes detected, but journeys job was '${JOURNEYS_RESULT:-}' (expected 'success')."
              exit 1
            fi
          fi

          # 3. When fullstack changes are detected, E2E must succeed
          if [ "${E2E_FILTER}" = "true" ]; then
            if [ "${E2E_RESULT:-}" != "success" ]; then
              echo "::error::Fullstack changes detected, but E2E job was '${E2E_RESULT:-}' (expected 'success')."
              exit 1
            fi
          fi

          # 4. When no frontend changes are detected, journeys must be skipped
          if [ "${FRONTEND_FILTER}" = "false" ]; then
            if [ "${JOURNEYS_RESULT:-}" != "skipped" ]; then
              echo "::error::No frontend changes detected, but journeys job was '${JOURNEYS_RESULT:-}' (expected 'skipped')."
              exit 1
            fi
          fi

          # 5. When no fullstack changes are detected, E2E must be skipped
          if [ "${E2E_FILTER}" = "false" ]; then
            if [ "${E2E_RESULT:-}" != "skipped" ]; then
              echo "::error::No fullstack changes detected, but E2E job was '${E2E_RESULT:-}' (expected 'skipped')."
              exit 1
            fi
          fi

          # 6. Fail closed on unexpected failure or cancellation
          if [ "${JOURNEYS_RESULT:-}" != "success" ] && [ "${JOURNEYS_RESULT:-}" != "skipped" ]; then
            echo "::error::Journeys job ended with non-passing status '${JOURNEYS_RESULT:-}'."
            exit 1
          fi
          if [ "${E2E_RESULT:-}" != "success" ] && [ "${E2E_RESULT:-}" != "skipped" ]; then
            echo "::error::E2E job ended with non-passing status '${E2E_RESULT:-}'."
            exit 1
          fi

          echo "Journey Gate passed successfully."
          exit 0
