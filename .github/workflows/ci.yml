name: CI

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked agent workflow runtime state
        run: |
          if [ -n "$(git ls-files -- '.agent-workflow/**')" ]; then
            echo "::error::Runtime state under .agent-workflow/ must not be tracked."
            git ls-files -- '.agent-workflow/**'
            exit 1
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'gradle/**'
              - 'config/detekt/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradlew'
              - 'gradlew.bat'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
              - '.github/workflows/ci.yml'
              - 'API_CONTRACT.md'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'API_CONTRACT.md'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/ci.yml'
  build:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: ./gradlew ktlintCheck
      - run: ./gradlew detektMain detektTest
      - run: ./gradlew test

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  docker:
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.docker == 'true' &&
      (
        (needs.changes.outputs.backend == 'true' && needs.build.result == 'success') ||
        (needs.changes.outputs.backend == 'false' && needs.build.result == 'skipped')
      )
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t chessecho-backend:test .
      - name: Smoke check container runtime and app.jar
        run: |
          docker run --rm --entrypoint java chessecho-backend:test -version
          docker run --rm --entrypoint test chessecho-backend:test -s /app/app.jar
      - name: Smoke check Stockfish UCI handshake
        run: |
          set -eo pipefail
          output=$(printf "uci\nquit\n" | timeout 15s docker run --rm -i --entrypoint stockfish chessecho-backend:test)
          echo "$output"
          echo "$output" | grep -q "uciok"
      - name: Log in to Docker Hub
        if: github.repository == 'NathanZK/ChessEcho' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish backend Docker image
        if: github.repository == 'NathanZK/ChessEcho' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag chessecho-backend:test nathanzk/chessecho-backend:sha-${{ github.sha }}
          docker tag chessecho-backend:test nathanzk/chessecho-backend:latest
          docker push nathanzk/chessecho-backend:sha-${{ github.sha }}
          docker push nathanzk/chessecho-backend:latest

  ci-gate:
    name: CI Gate
    needs: [changes, build, frontend, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify component job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_FILTER: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.build.result }}
          FRONTEND_FILTER: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_FILTER: ${{ needs.changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: ./scripts/ci_gate.sh

