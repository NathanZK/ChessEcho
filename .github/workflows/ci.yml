name: CI

'on':
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked agent workflow runtime state
        run: |
          if [ -n "$(git ls-files -- '.agent-workflow/**')" ]; then
            echo "::error::Runtime state under .agent-workflow/ must not be tracked."
            git ls-files -- '.agent-workflow/**'
            exit 1
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradlew'
              - 'gradlew.bat'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
              - '.github/workflows/ci.yml'
              - 'API_CONTRACT.md'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'API_CONTRACT.md'
            agents:
              - 'AGENTS.md'
              - '.agent-workflow/**'
              - '.github/agent-workflow.json'
              - '.github/agents/**'
              - 'docs/engineering/agent-workflow.md'
              - 'docs/engineering/workflow-boundaries.md'
              - 'docs/engineering/workflow-evidence.md'
              - 'docs/engineering/workflow-inspector.md'
              - 'docs/engineering/workflow-migration.md'
              - 'docs/engineering/workflow-policy.md'
              - 'docs/engineering/workflow-repair.md'
              - 'docs/engineering/workflow-runtime.md'
              - 'docs/engineering/workflow-supervisor.md'
              - 'docs/engineering/workflow-work-type-policy.md'
              - 'docs/engineering/workflow-plan-revisions.md'
              - 'docs/engineering/workflow-authority.md'
              - 'scripts/agent_workflow.py'
              - 'scripts/workflow_cas.py'
              - 'scripts/workflow_evidence.py'
              - 'scripts/workflow_inspector.py'
              - 'scripts/workflow_kernel.py'
              - 'scripts/workflow_migration.py'
              - 'scripts/workflow_policy.py'
              - 'scripts/workflow_repair.py'
              - 'scripts/workflow_runtime.py'
              - 'scripts/workflow_supervisor.py'
              - 'scripts/workflow_work_type_policy.py'
              - 'scripts/workflow_plan_revision_policy.py'
              - 'scripts/workflow_authority.py'
              - 'scripts/tests/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: ./gradlew ktlintCheck
      - run: ./gradlew test

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  agent-workflow:
    needs: changes
    if: ${{ needs.changes.outputs.agents == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make agent-workflow-test
