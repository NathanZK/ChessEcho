name: Nightly Hardening & Mutation Quality

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run domain property tests
        run: npm test -- src/__tests__/domainProperties.test.ts
      - name: Run targeted Stryker mutation tests
        run: npm run test:mutation
      - name: Archive frontend mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mutation-report
          path: frontend/reports/mutation/
          if-no-files-found: ignore

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run backend property tests
        run: ./gradlew test --tests "com.chessprobe.service.EvaluationLossPolicyPropertyTest"
      - name: Run targeted Pitest mutation tests
        run: ./gradlew pitest
      - name: Archive backend mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-report
          path: backend/build/reports/pitest/
          if-no-files-found: ignore

  evaluate-thresholds:
    needs: [frontend-quality, backend-quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download frontend mutation report
        uses: actions/download-artifact@v4
        with:
          name: frontend-mutation-report
          path: frontend/reports/mutation/
      - name: Download backend mutation report
        uses: actions/download-artifact@v4
        with:
          name: backend-mutation-report
          path: backend/build/reports/pitest/
      - name: Evaluate mutation scores against calibrated thresholds
        run: node scripts/eval-mutation-score.mjs --stryker=frontend/reports/mutation/mutation.json --pitest=backend/build/reports/pitest/mutations.xml --config=config/mutation-thresholds.json --ledger=config/verified-equivalents.json --allow-provisional
